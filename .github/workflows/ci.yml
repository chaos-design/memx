name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 只跑 ruff check，不跑 ruff format --check：
      # 仓库的行宽与风格是手工维护的，format 闸门会因存量偏差直接失败。
      # 固定 0.8.0（dev 依赖声明的版本下界）而非 latest，保证可复现，
      # 同时让 CI 守住「声明支持的最低 ruff 也能通过」这条线。
      - run: uvx ruff@0.8.0 check .
        name: ruff check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # fail-fast: false 让某个版本挂掉时其余版本仍给出信号
      fail-fast: false
      matrix:
        # 严格对齐 pyproject 的 classifiers 与 requires-python，不宣称未声明的版本
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # addopts 自带 --cov=mem 与 fail_under=90，覆盖率不达标会直接失败
      - run: uv run pytest
        name: pytest