name: Docs → Vercel 部署

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

# 同一 ref 重复触发时取消在跑的旧任务，节省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1) 安装依赖 → 构建 → 校验产物目录，作为部署前的门禁
  build:
    name: 安装依赖 & 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # 依赖与锁文件都在 site/ 子目录（npm 独立包），指定 lock 文件路径供缓存
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: cd site && npm install --no-audit --no-fund

      - name: Build site
        run: cd site && npm run build

      - name: Verify build output
        run: |
          test -f site/dist/index.html || { echo "✗ missing index.html in output dir"; exit 1; }
          test -f site/dist/artifacts/interview-question-bank.html || { echo "✗ missing artifact"; exit 1; }
          echo "✓ build OK: $(find site/dist -name '*.html' | wc -l) html pages in site/dist"

  # 2) 部署到 Vercel：PR → preview 部署；push main/master → production 部署
  #    仅当仓库已配置 VERCEL_TOKEN 等 Secrets 才执行；未配置时自动跳过（不报红）。
  deploy:
    name: 部署到 Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        # 安装依赖与构建在 Vercel 云端执行（读取 vercel.json 的 buildCommand/outputDirectory）
        uses: vercel/vercel-action@v3
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 主干 push 走生产部署；PR 走预览部署
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
