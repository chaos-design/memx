[project]
name = "memx"
version = "0.1.0"
description = "Human memory system for agents with layered recall, reflection, and forgetting."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "agent-library contributors" },
]
keywords = [
    "agent",
    "memory",
    "recall",
    "reflection",
    "knowledge-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
mem = "mem.cli:main"
memx = "mem.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
addopts = "-ra --cov=mem --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.coverage.run]
branch = true
source = ["mem"]
disable_warnings = ["module-not-measured"]

[tool.coverage.report]
fail_under = 90
show_missing = true
